name: 'Pruebas de comandos Bluetooth (UART en D10/D11)'
version: 1
author: 'Fabián Estiben Romero Villamil'

# 55 líneas: V, R, A, 0 y X repetidos 10 veces cada 400 ms, más 5 casos límite.
# Cada línea se envía por el monitor serial, conectado a D10/D11 como el HC-05.
